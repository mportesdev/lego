{% partialdef main_image %}
  {% if image.path %}<div><img src="{{ MEDIA_URL }}{{ image.path }}"></div>
  {% else %}<div class="ti ti-lego icon-96"></div>
  {% endif %}
{% endpartialdef %}

{% partialdef item_image %}
  {% if image.path %}<img src="{{ MEDIA_URL }}{{ image.path }}" loading="lazy">
  {% else %}<span class="ti ti-lego icon-96"></span>
  {% endif %}
{% endpartialdef %}
